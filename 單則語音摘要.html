<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>小露AI｜單則語音摘要</title>
<style>
:root{
  --primary:#169BD5; --pink:#DF0870; --green:#2E9E5B;
  --orange:#E8912D; --red:#D0362C; --text:#333333;
  --text-sub:#999999; --border:#E3E6EB; --bg:#F4F6F9;
  --sidebar-bg:#1B2A4A;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;}
a{text-decoration:none;color:inherit;}

.app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex-shrink:0;background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .name{font-size:20px;font-weight:700;letter-spacing:1px;}
.brand .sub{font-size:11px;color:#9FB0CC;margin-top:4px;}
.nav{padding:14px 0;flex:1;}
.nav-group-title{font-size:11px;color:#7C8CAE;padding:6px 20px;letter-spacing:1px;}
.nav-item{padding:11px 20px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#D8E1F0;border-left:3px solid transparent;}
.nav-item .ico{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(22,155,213,.18);border-left-color:var(--primary);color:#fff;font-weight:700;}
.sidebar-footer{padding:14px 20px;font-size:11px;color:#7C8CAE;border-top:1px solid rgba(255,255,255,.12);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;}
.breadcrumb{font-size:13px;color:var(--text-sub);}
.breadcrumb b{color:var(--text);font-weight:700;}
.user-menu{position:relative;}
.user-chip{font-size:13px;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;}
.user-chip:hover{background:#F4F6F9;}
.user-chip .chevron{font-size:10px;transition:transform .15s;}
.user-menu.open .user-chip .chevron{transform:rotate(180deg);}
.user-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:140px;padding:6px;display:none;z-index:40;}
.user-menu.open .user-dropdown{display:block;}
.user-dropdown-item{padding:9px 12px;font-size:13px;color:var(--text);border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.user-dropdown-item:hover{background:#F4F6F9;color:var(--red);}
.content{padding:22px 26px;flex:1;}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;}
.back-link:hover{text-decoration:underline;}

.detail-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:26px 30px;}
.detail-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.detail-meta .m-fld label{display:block;font-size:11px;color:var(--text-sub);margin-bottom:5px;}
.detail-meta .m-fld .v{font-size:14px;font-weight:700;color:var(--text);}
.block{margin-bottom:22px;}
.block-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.block-title .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);}
.block-body{font-size:13.5px;line-height:1.9;color:var(--text);background:#F9FBFD;border:1px solid var(--border);border-radius:6px;padding:14px 16px;white-space:pre-wrap;}
.block-body.transcript{max-height:260px;overflow-y:auto;font-family:"Roboto",Arial,sans-serif;color:#444;}
.block-body.note{background:#FFF9EE;border-color:#F2E2C0;color:#7A5A20;font-size:12.5px;}
.detail-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.ghost-btn{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 18px;font-size:14px;cursor:pointer;}
.ghost-btn:hover{border-color:var(--primary);color:var(--primary);}
.primary-btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.primary-btn:hover{background:#1287bc;}
.toast{position:fixed;bottom:26px;right:26px;background:#1B2A4A;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;transform:translateY(0);}
.empty-state{padding:60px 0;text-align:center;color:var(--text-sub);font-size:13px;background:#fff;border:1px solid var(--border);border-radius:8px;}
.empty-state .big{font-size:30px;margin-bottom:8px;}
</style>
</head>

function toggleUserMenu(e){
  e.stopPropagation();

}
document.addEventListener('click', function(e){
  const menu = document.getElementById('userMenu');
  if(menu && !menu.contains(e.target)) menu.classList.remove('open');
});
function doLogout(){ location.href = 'index.html'; }

const DAILY_NOTE = "本內容由小露（AI 語音助理）自動轉錄與摘要：語音轉文字使用 Google Cloud Speech-to-Text，結構化摘要使用 Vertex AI Gemini，送入前已執行敏感資訊遮罩處理。摘要僅供參考、不作為正式決策依據，請負責人以逐字內容確認後執行；原始語音檔將於處理完成後 24 小時內自動清除。";

function getParam(name){ return new URLSearchParams(location.search).get(name); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function downloadAsWord(filename, title, bodyHtml){
  const html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"+
    "<head><meta charset='utf-8'><title>"+title+"</title></head><body>"+bodyHtml+"</body></html>";
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("已產生 WORD 文件：" + filename);
}

const id = getParam('id');
const date = getParam('date');
const account = getParam('group');
const backParams = [];
if(date) backParams.push('date='+encodeURIComponent(date));
if(account) backParams.push('group='+encodeURIComponent(account));
const backHref = '每日語音列表.html' + (backParams.length ? ('?'+backParams.join('&')) : '');
document.getElementById('backLink').onclick = ()=>{ location.href = backHref; };

const v = DAILY_VOICES.find(x => x.id === id);
if(v){
  document.getElementById('detailWrap').style.display = 'block';
  document.getElementById('d_file').textContent = v.file;
  document.getElementById('d_time').textContent = v.datetime;
  document.getElementById('d_group').textContent = v.group;
  document.getElementById('d_title').textContent = v.title;
  document.getElementById('d_summary').textContent = v.summary;
  document.getElementById('d_transcript').textContent = v.transcript;
  document.getElementById('d_note').textContent = DAILY_NOTE;
  document.getElementById('backBtn2').onclick = ()=>{ location.href = backHref; };
  document.getElementById('d_downloadBtn').onclick = ()=>{
    downloadAsWord(v.file.replace('.aac','') + '_語音摘要.doc', v.title,
      '<h2>'+v.title+'</h2><p><b>語音檔名：</b>'+v.file+'</p><p><b>語音檔日期時間：</b>'+v.datetime+'</p><p><b>LINE 群暱稱：</b>'+v.group+'</p>'+
      '<h3>語音摘要</h3><p style="white-space:pre-wrap;">'+v.summary+'</p>'+
      '<h3>語音逐字內容</h3><p style="white-space:pre-wrap;">'+v.transcript+'</p>'+
      '<h3>小露作業說明</h3><p style="white-space:pre-wrap;font-size:12px;color:#7A5A20;">'+DAILY_NOTE+'</p>');
  };
} else {
  document.getElementById('notFound').style.display = 'block';
}
