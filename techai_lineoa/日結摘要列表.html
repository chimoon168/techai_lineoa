<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音小露｜日結摘要列表</title>
<style>
:root{
  --primary:#169BD5; --pink:#DF0870; --green:#2E9E5B;
  --orange:#E8912D; --red:#D0362C; --text:#333333;
  --text-sub:#999999; --border:#E3E6EB; --bg:#F4F6F9;
  --sidebar-bg:#1B2A4A;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;}
a{text-decoration:none;color:inherit;}

.app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex-shrink:0;background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .name{font-size:20px;font-weight:700;letter-spacing:1px;}
.brand .sub{font-size:11px;color:#9FB0CC;margin-top:4px;}
.nav{padding:14px 0;flex:1;}
.nav-group-title{font-size:11px;color:#7C8CAE;padding:6px 20px;letter-spacing:1px;}
.nav-item{padding:11px 20px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#D8E1F0;border-left:3px solid transparent;}
.nav-item .ico{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(22,155,213,.18);border-left-color:var(--primary);color:#fff;font-weight:700;}
.sidebar-footer{padding:14px 20px;font-size:11px;color:#7C8CAE;border-top:1px solid rgba(255,255,255,.12);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;}
.breadcrumb{font-size:13px;color:var(--text-sub);}
.breadcrumb b{color:var(--text);font-weight:700;}
.user-chip{font-size:13px;color:var(--text-sub);}
.content{padding:22px 26px;flex:1;}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.page-title{font-size:19px;font-weight:700;}
.page-desc{font-size:12px;color:var(--text-sub);margin-top:4px;}

.filter-bar{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 18px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px;}
.fld{display:flex;flex-direction:column;gap:6px;}
.fld label{font-size:12px;color:var(--text-sub);}
.fld input[type=date], .fld select{
  border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:14px;color:var(--text);background:#fff;min-width:160px;
}
.fld input[type=date]:focus, .fld select:focus{outline:none;border-color:var(--primary);}

.result-count{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-sub);margin-bottom:10px;}
.result-count b{color:var(--text);}
table.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
table.grid thead th{background:#F7F9FC;color:var(--text-sub);font-size:12px;font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);}
table.grid tbody td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
table.grid tbody tr{cursor:pointer;transition:background .12s;}
table.grid tbody tr:hover{background:#F0F8FC;}
table.grid tbody tr:last-child td{border-bottom:none;}
.chev{color:var(--text-sub);font-size:12px;}
.empty-state{padding:60px 0;text-align:center;color:var(--text-sub);font-size:13px;background:#fff;border:1px solid var(--border);border-radius:8px;}
.empty-state .big{font-size:30px;margin-bottom:8px;}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="name">🎙️ 語音小露</div>
      <div class="sub">LINE 語音智能助理・技術處辦公室自動化</div>
    </div>
    <div class="nav">
      <div class="nav-group-title">語音小露</div>
      <a class="nav-item" href="每日語音列表.html"><span class="ico">📅</span>每日語音</a>
      <a class="nav-item active" href="日結摘要列表.html"><span class="ico">🗂️</span>日結摘要</a>
    </div>
    <div class="sidebar-footer">開發畫面原型 v0.2<br>對應功能二：語音訊息分析摘要</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">語音小露 &nbsp;›&nbsp; <b>日結摘要</b></div>
      <div class="user-chip">Chimoon（PXEC）</div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <div class="page-title">日結摘要列表</div>
          <div class="page-desc">預設顯示本月清單，日結時間以結束日（隔日 17:59:59）為認定日期，點選列表可進入日結摘要內容</div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="fld">
          <label>指定 LINE 帳號</label>
          <select id="lineAccountFilter" onchange="renderList()">
            <option value="">全部帳號</option>
            <option value="小露OA">小露OA</option>
            <option value="全電商管理群">全電商管理群</option>
          </select>
        </div>
        <div class="fld">
          <label>年月（YYYY-MM）</label>
          <select id="monthFilter" onchange="renderList()"></select>
        </div>
      </div>

      <div class="result-count"><span>查詢結果（共 <b id="digestCount">0</b> 筆）</span></div>
      <table class="grid" id="digestTable">
        <thead>
          <tr><th>LINE 群暱稱</th><th style="width:150px;">日結時間</th><th style="width:190px;">建立時間</th><th style="width:36px;"></th></tr>
        </thead>
        <tbody id="digestTbody"></tbody>
      </table>
      <div class="empty-state" id="digestEmpty" style="display:none;">
        <div class="big">📭</div>查無符合條件的日結彙整紀錄
      </div>
    </div>
  </div>
</div>

<script>
/* LINE 群暱稱僅示意「小露OA」「全電商管理群」兩個試辦群組 */
const DIGESTS = [
  {id:"dg1", group:"全電商管理群", endDate:"2026-08-16", createdAt:"2026-08-17 08:02:11"},
  {id:"dg2", group:"小露OA",       endDate:"2026-08-16", createdAt:"2026-08-17 08:02:15"},
  {id:"dg3", group:"全電商管理群", endDate:"2026-08-15", createdAt:"2026-08-16 08:01:47"},
  {id:"dg4", group:"小露OA",       endDate:"2026-08-15", createdAt:"2026-08-16 08:01:52"},
  {id:"dg5", group:"全電商管理群", endDate:"2026-07-23", createdAt:"2026-07-24 08:03:02"},
  {id:"dg6", group:"小露OA",       endDate:"2026-07-22", createdAt:"2026-07-23 08:02:47"},
];

function getParam(name){ return new URLSearchParams(location.search).get(name); }

function populateMonthOptions(){
  const sel = document.getElementById('monthFilter');
  const months = Array.from(new Set(DIGESTS.map(r=>r.endDate.slice(0,7)))).sort().reverse();
  const currentMonth = "2026-08";
  if(!months.includes(currentMonth)) months.unshift(currentMonth);
  sel.innerHTML = '';
  months.forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });
  const urlMonth = getParam('month');
  sel.value = (urlMonth && months.includes(urlMonth)) ? urlMonth : currentMonth;
}

function renderList(){
  const month = document.getElementById('monthFilter').value;
  const account = document.getElementById('lineAccountFilter').value;
  const rows = DIGESTS.filter(r => r.endDate.slice(0,7) === month && (!account || r.group === account))
                       .sort((a,b)=> b.endDate.localeCompare(a.endDate));
  const tbody = document.getElementById('digestTbody');
  tbody.innerHTML = '';
  document.getElementById('digestCount').textContent = rows.length;
  document.getElementById('digestEmpty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('digestTable').style.display = rows.length ? 'table' : 'none';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+r.group+'</td><td>'+r.endDate+'</td><td>'+r.createdAt+'</td><td class="chev">›</td>';
    tr.onclick = ()=>{ location.href = '日結摘要內容.html?id='+encodeURIComponent(r.id)+'&month='+encodeURIComponent(month)+'&group='+encodeURIComponent(account); };
    tbody.appendChild(tr);
  });
}

const urlAccount = getParam('group');
document.getElementById('lineAccountFilter').value = urlAccount || "";
populateMonthOptions();
renderList();
</script>
</body>
</html>
